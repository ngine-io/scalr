name: Lint

on: [push, pull_request]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          enable-cache: true
      - name: Lint
        run: uv run --locked --only-group dev ruff check --output-format=github .
      - name: Format check
        run: uv run --locked --only-group dev ruff format --check .
