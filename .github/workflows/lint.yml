name: Lint

on: [push, pull_request]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          enable-cache: true
      - name: Lint
        run: uv run --locked --only-group dev ruff check --output-format=github .
      - name: Format check
        run: uv run --locked --only-group dev ruff format --check .
