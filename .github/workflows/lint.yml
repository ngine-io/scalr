name: Lint

on: [push, pull_request]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          enable-cache: true
      - name: Lint
        run: uv run --locked --only-group dev ruff check --output-format=github .
      - name: Format check
        run: uv run --locked --only-group dev ruff format --check .
