name: Lint

on: [push, pull_request]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          enable-cache: true
      - name: Lint
        run: uv run --locked --only-group dev ruff check --output-format=github .
      - name: Format check
        run: uv run --locked --only-group dev ruff format --check .
