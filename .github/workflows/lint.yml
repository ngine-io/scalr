name: Lint

on: [push, pull_request]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          enable-cache: true
      - name: Lint
        run: uv run --locked --only-group dev ruff check --output-format=github .
      - name: Format check
        run: uv run --locked --only-group dev ruff format --check .
